<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>JS-Quiz Kapitel 1 &amp; 2</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;600&family=JetBrains+Mono:wght@400;700&display=swap"
    />
    <style>
      /* Layout: eine Frage pro Bildschirm, zentrierte Karte, grosse Typo für den Beamer */
      :root {
        --bg: #f4f6fb;
        --surface: #ffffff;
        --fg: #15192b;
        --muted: #5b6382;
        --line: #d9deec;
        --accent: #2f4fd8;
        --accent-soft: #e5eaff;
        --correct: #117a4a;
        --correct-soft: #d9f3e5;
        --wrong: #b3261e;
        --wrong-soft: #fbe3e1;
        --font-display: "Space Grotesk", "Trebuchet MS", sans-serif;
        --font-body: "Inter", "Helvetica Neue", Arial, sans-serif;
        --font-mono: "JetBrains Mono", "SFMono-Regular", Consolas, monospace;
        color-scheme: light;
      }

      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --bg: #0d1021;
          --surface: #161a30;
          --fg: #eef1fb;
          --muted: #9aa3c4;
          --line: #2a3053;
          --accent: #7f9bff;
          --accent-soft: #212a52;
          --correct: #4ade9b;
          --correct-soft: #16352a;
          --wrong: #ff8f85;
          --wrong-soft: #3a1e1c;
          color-scheme: dark;
        }
      }

      :root[data-theme="dark"] {
        --bg: #0d1021;
        --surface: #161a30;
        --fg: #eef1fb;
        --muted: #9aa3c4;
        --line: #2a3053;
        --accent: #7f9bff;
        --accent-soft: #212a52;
        --correct: #4ade9b;
        --correct-soft: #16352a;
        --wrong: #ff8f85;
        --wrong-soft: #3a1e1c;
        color-scheme: dark;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
      }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        font-family: var(--font-body);
        font-size: clamp(16px, 1.1vw + 12px, 22px);
        line-height: 1.5;
      }

      .page {
        min-height: 100%;
        display: flex;
        flex-direction: column;
        gap: 24px;
        padding-block: 24px 20px;
        padding-left: max(16px, env(safe-area-inset-left, 0px));
        padding-right: max(16px, env(safe-area-inset-right, 0px));
      }

      header {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 12px 20px;
        max-width: 1100px;
        width: 100%;
        margin: 0 auto;
      }

      .brand {
        font-family: var(--font-display);
        font-weight: 700;
        letter-spacing: 0.02em;
        font-size: 1.05em;
      }

      .brand span {
        color: var(--muted);
        font-weight: 500;
      }

      .dots {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-left: auto;
      }

      .dot {
        width: 26px;
        height: 6px;
        border-radius: 99px;
        background: var(--line);
        border: 0;
        padding: 0;
        cursor: pointer;
      }

      .dot[data-state="done"] {
        background: var(--muted);
      }

      .dot[data-state="current"] {
        background: var(--accent);
      }

      main {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .card {
        width: 100%;
        max-width: 1100px;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 18px;
        padding: clamp(20px, 3vw, 40px);
        display: flex;
        flex-direction: column;
        gap: 22px;
      }

      .meta {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 12px;
        font-size: 0.72em;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.09em;
        font-weight: 600;
      }

      .chip {
        background: var(--accent-soft);
        color: var(--accent);
        padding: 4px 10px;
        border-radius: 99px;
        letter-spacing: 0.06em;
      }

      h1 {
        font-family: var(--font-display);
        font-weight: 700;
        font-size: clamp(1.5em, 2.4vw + 0.8em, 2.1em);
        line-height: 1.2;
        text-wrap: balance;
        margin: 0;
      }

      pre {
        margin: 0;
        padding: 16px 18px;
        background: var(--bg);
        border: 1px solid var(--line);
        border-radius: 12px;
        overflow-x: auto;
        font-family: var(--font-mono);
        font-size: 0.82em;
        line-height: 1.6;
      }

      .answers {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
      }

      @media (max-width: 760px) {
        .answers {
          grid-template-columns: minmax(0, 1fr);
        }
      }

      .answer {
        display: flex;
        align-items: flex-start;
        gap: 14px;
        min-width: 0;
        text-align: left;
        font: inherit;
        color: inherit;
        background: var(--surface);
        border: 2px solid var(--line);
        border-radius: 12px;
        padding: 14px 16px;
        cursor: pointer;
        transition:
          border-color 0.15s,
          background 0.15s;
      }

      .answer:hover:not(:disabled) {
        border-color: var(--accent);
      }

      .answer:disabled {
        cursor: default;
      }

      .answer .key {
        font-family: var(--font-mono);
        font-weight: 700;
        color: var(--muted);
        flex: none;
      }

      .answer .label {
        min-width: 0;
      }

      .answer code {
        font-family: var(--font-mono);
        font-size: 0.92em;
      }

      .answer[data-state="correct"] {
        border-color: var(--correct);
        background: var(--correct-soft);
      }

      .answer[data-state="correct"] .key {
        color: var(--correct);
      }

      .answer[data-state="wrong"] {
        border-color: var(--wrong);
        background: var(--wrong-soft);
      }

      .answer[data-state="wrong"] .key {
        color: var(--wrong);
      }

      .answer[data-state="dim"] {
        opacity: 0.45;
      }

      .explain {
        border-left: 4px solid var(--accent);
        padding: 2px 0 2px 16px;
        color: var(--muted);
      }

      .explain b {
        color: var(--fg);
      }

      .explain code {
        font-family: var(--font-mono);
        font-size: 0.9em;
      }

      footer {
        max-width: 1100px;
        width: 100%;
        margin: 0 auto;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 10px 14px;
        color: var(--muted);
        font-size: 0.78em;
      }

      button.ctrl {
        font: inherit;
        font-size: 1em;
        color: var(--fg);
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 99px;
        padding: 8px 18px;
        cursor: pointer;
      }

      button.ctrl:hover {
        border-color: var(--accent);
      }

      button.ctrl.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
        font-weight: 600;
      }

      .hint {
        margin-left: auto;
        font-family: var(--font-mono);
        font-size: 0.95em;
      }

      kbd {
        font-family: var(--font-mono);
        border: 1px solid var(--line);
        border-bottom-width: 2px;
        border-radius: 6px;
        padding: 1px 6px;
        font-size: 0.95em;
      }

      .end {
        text-align: center;
        display: flex;
        flex-direction: column;
        gap: 16px;
        align-items: center;
      }

      .end h1 {
        font-size: clamp(1.8em, 3vw + 1em, 2.6em);
      }

      @media (prefers-reduced-motion: reduce) {
        * {
          transition: none !important;
        }
      }
    </style>
  </head>

  <body>
    <div class="page">
      <header>
        <div class="brand">JS-Quiz <span>· Kapitel 1 &amp; 2</span></div>
        <div class="dots" id="dots"></div>
      </header>

      <main>
        <section class="card" id="card" aria-live="polite"></section>
      </main>

      <footer>
        <button class="ctrl" id="prevBtn" type="button">← Zurück</button>
        <button class="ctrl primary" id="nextBtn" type="button">Auflösen</button>
        <button class="ctrl" id="themeBtn" type="button">Hell / Dunkel</button>
        <span class="hint"
          ><kbd>←</kbd> <kbd>→</kbd> blättern · <kbd>Leertaste</kbd> auflösen ·
          <kbd>a</kbd>–<kbd>d</kbd> antworten</span
        >
      </footer>
    </div>

    <script>
      const questions = [
        {
          kapitel: 1,
          frage: "Diese Zeile steht am Ende von <code>index.html</code>. Was macht sie?",
          code: '<script src="./script.js"><\/script>',
          antworten: [
            "Sie erstellt die Datei <code>script.js</code>.",
            "Sie verbindet <code>script.js</code> mit der Webseite.",
            "Sie startet den Live Server.",
            "Sie führt nur die erste Zeile von <code>script.js</code> aus.",
          ],
          richtig: 1,
          erklaerung:
            "Ohne diese Zeile lädt der Browser deinen Code gar nicht — dein JavaScript tut dann scheinbar nichts.",
        },
        {
          kapitel: 1,
          frage: "Was passiert, wenn man auf den blauen Knopf klickt?",
          code:
            'let blueButton = document.querySelector("#blueButton");\nlet spaceScene = document.querySelector("#spaceScene");\n\nblueButton.addEventListener("click", function () {\n  spaceScene.style.backgroundColor = "blue";\n});',
          antworten: [
            "Der Knopf wird blau.",
            "Die ganze Webseite wird blau.",
            "Der Hintergrund der Weltraum-Szene wird blau.",
            "Nichts, der Code läuft sofort beim Laden.",
          ],
          richtig: 2,
          erklaerung:
            "Der Knopf ist der <b>Auslöser</b>, die Szene ist das <b>Ziel</b>. Verändert wird immer das Element vor dem Punkt: <code>spaceScene</code>.",
        },
        {
          kapitel: 2,
          frage: "Was macht die erste Zeile?",
          code:
            'let spaceScene = document.querySelector("#spaceScene");\nspaceScene.style.backgroundColor = "blue";',
          antworten: [
            "Sie erstellt ein neues HTML-Element.",
            "Sie färbt das Element blau.",
            "Sie sucht das Element mit der ID <code>spaceScene</code> und merkt es sich unter diesem Namen.",
            "Sie löscht das Element aus der Webseite.",
          ],
          richtig: 2,
          erklaerung:
            "Schritt 1 ist immer <b>auswählen</b>, Schritt 2 ist <b>verändern</b>. Zeile 1 verändert noch gar nichts.",
        },
        {
          kapitel: 2,
          frage: "Welcher Befehl wählt dieses Element über seine ID aus?",
          code: '<section id="spaceScene" class="space-scene"></section>',
          antworten: [
            '<code>document.querySelector("spaceScene")</code>',
            '<code>document.querySelector("#spaceScene")</code>',
            '<code>document.querySelector("#space-scene")</code>',
            '<code>document.getElement("spaceScene")</code>',
          ],
          richtig: 1,
          erklaerung:
            "Das <code>#</code> steht für die ID — genau wie in CSS. Und die ID heisst <code>spaceScene</code>, nicht <code>space-scene</code>.",
        },
        {
          kapitel: 2,
          frage: "Diese CSS-Regel willst du in JavaScript schreiben. Welche Zeile ist richtig?",
          code: "#robot {\n  border-color: yellow;\n}",
          antworten: [
            '<code>robot.style.border-color = "yellow";</code>',
            '<code>robot.border-color = "yellow";</code>',
            '<code>robot.style.BorderColor = "yellow";</code>',
            '<code>robot.style.borderColor = "yellow";</code>',
          ],
          richtig: 3,
          erklaerung:
            "Kein Bindestrich, dafür ein grosser Buchstabe in der Mitte: <code>borderColor</code>, <code>backgroundColor</code>, <code>fontSize</code>.",
        },
        {
          kapitel: 2,
          frage: "Was passiert mit dem Element <code>#statusText</code>?",
          code:
            'let statusText = document.querySelector("#statusText");\nstatusText.textContent = "Roboter ist bereit!";',
          antworten: [
            "Der bisherige Text im Element wird durch den neuen ersetzt.",
            "Der neue Text wird hinten angehängt.",
            "Das Element bekommt einen Tooltip mit diesem Text.",
            "Der Text wird in die Datei <code>index.html</code> geschrieben.",
          ],
          richtig: 0,
          erklaerung:
            "<code>textContent</code> <b>setzt</b> den Text. Was vorher drin stand, ist weg.",
        },
        {
          kapitel: 2,
          frage: "Warum funktioniert dieser Code nicht?",
          code: 'robot.style.width = "200px";\nlet robot = document.querySelector("#robot");',
          antworten: [
            "Bei <code>width</code> dürfen keine Anführungszeichen stehen.",
            "Das Element wird verändert, bevor es ausgewählt wurde.",
            "Es fehlt ein <code>addEventListener</code>.",
            "<code>#robot</code> müsste <code>.robot</code> heissen.",
          ],
          richtig: 1,
          erklaerung:
            "JavaScript liest von <b>oben nach unten</b>. In Zeile 1 kennt es <code>robot</code> noch gar nicht.",
        },
        {
          kapitel: 2,
          frage: "Welche Farbe hat die Szene am Ende?",
          code:
            'let spaceScene = document.querySelector("#spaceScene");\nspaceScene.style.backgroundColor = "red";\nspaceScene.style.backgroundColor = "green";',
          antworten: [
            "Rot, die erste Zeile gilt.",
            "Grün, die letzte Zeile gilt.",
            "Beide Farben werden gemischt.",
            "Keine, die zwei Zeilen heben sich auf.",
          ],
          richtig: 1,
          erklaerung:
            "Von oben nach unten: Zeile 3 überschreibt Zeile 2. Zu sehen ist nur das Ergebnis am Schluss.",
        },
        {
          kapitel: 2,
          frage: "Was macht dieser Code?",
          code: 'let energy = document.querySelector("#energy");\nenergy.remove();',
          antworten: [
            "Er entfernt das Element aus der Webseite im Browser.",
            "Er macht das Element unsichtbar, lässt es aber stehen.",
            "Er löscht den Text im Element.",
            "Er löscht die Zeile in der Datei <code>index.html</code>.",
          ],
          richtig: 0,
          erklaerung:
            "Beim Neuladen ist das Element wieder da: die Datei <code>index.html</code> bleibt unverändert.",
        },
        {
          kapitel: 2,
          frage: "Welche Zeile löscht das Element richtig?",
          code: 'let energy = document.querySelector("#energy");\n// ???',
          antworten: [
            "<code>energy.remove;</code>",
            "<code>energy.remove = true;</code>",
            "<code>energy.remove();</code>",
            '<code>energy.remove("#energy");</code>',
          ],
          richtig: 2,
          erklaerung:
            "<code>remove()</code> ist ein <b>Befehl</b>: runde Klammern, kein <code>=</code>. Das Element steht schon vor dem Punkt.",
        },
        {
          kapitel: 2,
          frage: "Im HTML steht <code>&lt;img id=\"robot\" src=\"...\"&gt;</code>. Warum findet diese Zeile nichts?",
          code: 'let robot = document.querySelector("robot");',
          antworten: [
            "Der Name müsste gross geschrieben werden.",
            "Es fehlt das <code>#</code> für die ID.",
            "Bilder kann man nicht auswählen.",
            "Es fehlt <code>let</code> vor <code>document</code>.",
          ],
          richtig: 1,
          erklaerung:
            "Ohne <code>#</code> sucht JavaScript nach einem HTML-Element namens <code>&lt;robot&gt;</code> — das gibt es nicht.",
        },
        {
          kapitel: 2,
          frage: "Warum erscheint hier kein Text?",
          code: 'let statusText = document.querySelector("#statusText");\nstatusText.style.textContent = "Alarm!";',
          antworten: [
            "<code>textContent</code> gehört nicht zu <code>style</code>.",
            "Der Text ist zu kurz.",
            "Es fehlen die Anführungszeichen.",
            "<code>statusText</code> ist ein verbotener Name.",
          ],
          richtig: 0,
          erklaerung:
            "Nach <code>style.</code> kommen nur CSS-Eigenschaften. Richtig ist: <code>statusText.textContent = \"Alarm!\";</code>",
        },
      ];

      const keys = ["a", "b", "c", "d"];
      const card = document.getElementById("card");
      const dots = document.getElementById("dots");
      const prevBtn = document.getElementById("prevBtn");
      const nextBtn = document.getElementById("nextBtn");
      const themeBtn = document.getElementById("themeBtn");

      let index = 0;
      let revealed = false;
      let chosen = null;

      function renderDots() {
        dots.innerHTML = "";
        questions.forEach((_, i) => {
          const b = document.createElement("button");
          b.className = "dot";
          b.type = "button";
          b.setAttribute("aria-label", "Frage " + (i + 1));
          b.dataset.state = i === index ? "current" : i < index ? "done" : "todo";
          b.addEventListener("click", () => goTo(i));
          dots.appendChild(b);
        });
      }

      function render() {
        renderDots();

        if (index >= questions.length) {
          card.innerHTML =
            '<div class="end"><div class="meta"><span class="chip">Fertig</span></div>' +
            "<h1>Das war's!</h1>" +
            "<p>Alle Befehle aus Kapitel 1 und 2 stehen im Cheatsheet — nachschauen ist erlaubt.</p></div>";
          prevBtn.disabled = false;
          nextBtn.textContent = "Nochmals";
          return;
        }

        const q = questions[index];
        const parts = [];

        parts.push(
          '<div class="meta"><span class="chip">Kapitel ' +
            q.kapitel +
            "</span><span>Frage " +
            (index + 1) +
            " von " +
            questions.length +
            "</span></div>",
        );
        parts.push("<h1>" + q.frage + "</h1>");

        if (q.code) {
          const esc = q.code
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;");
          parts.push("<pre><code>" + esc + "</code></pre>");
        }

        parts.push('<div class="answers">');
        q.antworten.forEach((text, i) => {
          let state = "";
          if (revealed) {
            if (i === q.richtig) state = "correct";
            else if (i === chosen) state = "wrong";
            else state = "dim";
          }
          parts.push(
            '<button class="answer" type="button" data-i="' +
              i +
              '"' +
              (state ? ' data-state="' + state + '"' : "") +
              (revealed ? " disabled" : "") +
              '><span class="key">' +
              keys[i] +
              ')</span><span class="label">' +
              text +
              "</span></button>",
          );
        });
        parts.push("</div>");

        if (revealed) {
          parts.push('<p class="explain">' + q.erklaerung + "</p>");
        }

        card.innerHTML = parts.join("");

        card.querySelectorAll(".answer").forEach((btn) => {
          btn.addEventListener("click", () => choose(Number(btn.dataset.i)));
        });

        prevBtn.disabled = index === 0;
        nextBtn.textContent = revealed ? "Weiter →" : "Auflösen";
      }

      function choose(i) {
        if (revealed) return;
        chosen = i;
        revealed = true;
        render();
      }

      function reveal() {
        if (revealed) return;
        revealed = true;
        render();
      }

      function goTo(i) {
        index = Math.max(0, Math.min(questions.length, i));
        revealed = false;
        chosen = null;
        render();
      }

      function next() {
        if (index >= questions.length) return goTo(0);
        if (!revealed) return reveal();
        goTo(index + 1);
      }

      prevBtn.addEventListener("click", () => goTo(index - 1));
      nextBtn.addEventListener("click", next);

      themeBtn.addEventListener("click", () => {
        const dark =
          document.documentElement.dataset.theme === "dark" ||
          (!document.documentElement.dataset.theme &&
            window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "light" : "dark";
      });

      document.addEventListener("keydown", (e) => {
        if (e.key === "ArrowRight" || e.key === " " || e.key === "Enter") {
          e.preventDefault();
          next();
        } else if (e.key === "ArrowLeft") {
          e.preventDefault();
          goTo(index - 1);
        } else if (keys.includes(e.key.toLowerCase())) {
          const i = keys.indexOf(e.key.toLowerCase());
          if (index < questions.length && i < questions[index].antworten.length) choose(i);
        } else if (e.key.toLowerCase() === "f") {
          if (document.fullscreenElement) document.exitFullscreen();
          else document.documentElement.requestFullscreen?.().catch(() => {});
        }
      });

      render();
    </script>
  </body>
</html>
