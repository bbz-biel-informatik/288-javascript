<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <title>Match-Counter</title>
    <link rel="stylesheet" href="./style.css" />
  </head>

  <body>
    <header class="site-header">
      <a href="../index.html">← Übungsauswahl</a>
      <span class="kapitel">Kapitel 5: If-Else</span>
    </header>

    <main class="inhalt">
      <div class="card">
        <h1>Match-Counter</h1>
        <p class="hint">Zähle die Tore und bestimme den Sieger.</p>

        <div class="spielstand">
          <div class="team">
            <p class="name">Team A</p>
            <p id="scoreA" class="zahl">0</p>
          </div>

          <span class="trenner">:</span>

          <div class="team">
            <p class="name">Team B</p>
            <p id="scoreB" class="zahl">0</p>
          </div>
        </div>

        <div class="knoepfe">
          <button id="goalButtonA">Tor für A</button>
          <button id="goalButtonB">Tor für B</button>
        </div>

        <button id="winnerButton" class="grau">Spiel fertig</button>

        <p id="winnerText" class="resultat">Das Spiel läuft.</p>
      </div>
    </main>

    <script src="./script.js"></script>
  </body>
</html>
