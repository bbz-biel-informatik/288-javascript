<html lang="en">

<head>
  <title>Eat Game</title>
  <link rel="stylesheet" href="./style.css" />
</head>

<body>
  <div id="wrapper">
    <div id="playground">
      <h1 id="title">Eat Game</h1>
      <img id="player" src="./assets/player_pink.png" alt="Player" />
      <img id="food" class="gameobject" src="./assets/food.png" alt="Food" />
      <div id="score" class="hud">Score: 0</div>
      <div id="timer" class="hud">Time: 20</div>
    </div>
  </div>
  <script src="https://bbz-biel-informatik.github.io/288-javascript/game-framework/bbzgame.js"></script>
</body>

</html>
