<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <title>Counter</title>
    <link rel="stylesheet" href="./style.css" />
  </head>

  <body>
    <header class="site-header">
      <a href="../index.html">← Übungsauswahl</a>
      <span class="kapitel">Kapitel 4: Variablen</span>
    </header>

    <main class="inhalt">
      <div class="card">
        <h1>Counter</h1>
        <p class="hint">Wie oft hast du geklickt?</p>

        <div class="anzeige">
          <p id="counterDisplay" class="zahl">0</p>
        </div>

        <div class="knoepfe">
          <button id="plusButton">+1</button>
          <button id="minusButton">-1</button>
          <button id="plusThreeButton">+3</button>
          <button id="doubleButton">×2</button>
          <button id="resetButton" class="grau">Zurücksetzen</button>
        </div>
      </div>
    </main>

    <script src="./script.js"></script>
  </body>
</html>
