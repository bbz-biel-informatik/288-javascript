<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <title>Shop</title>
    <link rel="stylesheet" href="./style.css" />
  </head>

  <body>
    <header class="site-header">
      <a href="../index.html">← Übungsauswahl</a>
      <span class="kapitel">Kapitel 4: Variablen</span>
    </header>

    <main class="inhalt">
      <div class="shop">
        <header class="shop-header">
          <div class="logo">Kleiderladen</div>

          <div class="konto">
            <p id="moneyText">Geld: 100 Franken</p>
            <p id="cartText">🛒 Artikel: 0</p>
          </div>
        </header>

        <main class="produkte">
          <div class="produkt">
            <div class="bild">🧥</div>
            <b class="name">Winterjacke</b>
            <p class="preis">80 Franken</p>
            <button id="buyButton1">In den Warenkorb</button>
          </div>

          <div class="produkt">
            <div class="bild">👟</div>
            <b class="name">Sneaker</b>
            <p class="preis">50 Franken</p>
            <button id="buyButton2">In den Warenkorb</button>
          </div>

          <div class="produkt">
            <div class="bild">👕</div>
            <b class="name">T-Shirt</b>
            <p class="preis">20 Franken</p>
            <button id="buyButton3">In den Warenkorb</button>
          </div>
        </main>
      </div>
    </main>

    <script src="./script.js"></script>
  </body>
</html>
